name: main
on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - 4.11.x
          - 4.12.x
          - 4.13.x
          - 4.14.x
          - 5.0.x
          - 5.1.x
          - 5.2.x
          - 5.3.x
          - 5.4.x
          - 5.5.x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - name: Make metapp
        run: |
          opam exec -- sh -x ".github/scripts/build.sh"
